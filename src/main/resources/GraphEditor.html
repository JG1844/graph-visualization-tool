<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Graph 绘制工具 | 邻接表生成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        #graphCanvas {
            border: 2px solid #333;
            background: #f8f8f8;
            cursor: crosshair;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        .adjacency-list {
            flex: 1;
            min-width: 300px;
            border: 2px solid #333;
            padding: 10px;
            max-height: 600px;
            overflow-y: auto;
        }
        .adjacency-list h3 {
            margin-bottom: 10px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .node-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
<h1>交互式 Graph 绘制工具</h1>
<div class="controls">
    <button id="createGraphBtn">Create Graph (清空画布)</button>
    <button id="clearBtn">清空邻接表</button>
    <div class="node-info">
        操作说明：<br>
        1. 点击画布创建节点 | 2. 拖拽节点移动 | 3. 点击两个节点生成边 | 4. 右键节点删除
    </div>
</div>
<div class="container">
    <canvas id="graphCanvas" width="800" height="600"></canvas>
    <div class="adjacency-list">
        <h3>邻接表 (Adjacency List)</h3>
        <div id="adjacencyListContent"></div>
    </div>
</div>

<script>
    // 1. 核心变量初始化
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const adjacencyListContent = document.getElementById('adjacencyListContent');
    const createGraphBtn = document.getElementById('createGraphBtn');
    const clearBtn = document.getElementById('clearBtn');

    // 节点数组：存储所有节点 { id, x, y, radius, color }
    let nodes = [];
    // 边数组：存储所有边 { from: 节点id, to: 节点id }
    let edges = [];
    // 临时变量：记录当前选中的节点（用于连线）、拖拽中的节点
    let selectedNode = null;
    let draggingNode = null;
    let dragOffset = { x: 0, y: 0 };
    // 节点ID自增器
    let nodeIdCounter = 1;

    // 2. 工具函数：获取鼠标在画布中的坐标
    function getMousePos(canvas, evt) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: evt.clientX - rect.left,
            y: evt.clientY - rect.top
        };
    }

    // 3. 工具函数：判断鼠标是否在节点内
    function isPointInNode(mousePos, node) {
        const dx = mousePos.x - node.x;
        const dy = mousePos.y - node.y;
        return Math.sqrt(dx * dx + dy * dy) <= node.radius;
    }

    // 4. 绘制所有节点和边
    function drawGraph() {
        // 清空画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 第一步：绘制边（先画边，避免边覆盖节点）
        edges.forEach(edge => {
            const fromNode = nodes.find(n => n.id === edge.from);
            const toNode = nodes.find(n => n.id === edge.to);
            if (fromNode && toNode) {
                ctx.beginPath();
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                ctx.moveTo(fromNode.x, fromNode.y);
                ctx.lineTo(toNode.x, toNode.y);
                ctx.stroke();
            }
        });

        // 第二步：绘制节点
        nodes.forEach(node => {
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            // 选中的节点高亮
            ctx.fillStyle = node === selectedNode ? '#ff9800' : node.color;
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
            // 绘制节点ID
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.id, node.x, node.y);
        });

        // 更新邻接表
        updateAdjacencyList();
    }

    // 5. 更新邻接表展示
    function updateAdjacencyList() {
        // 构建邻接表结构：key=节点id，value=相邻节点id数组
        const adjacencyList = {};
        // 初始化所有节点的邻接数组
        nodes.forEach(node => {
            adjacencyList[node.id] = [];
        });
        // 填充边的关系
        edges.forEach(edge => {
            adjacencyList[edge.from].push(edge.to);
            // 无向图：双向添加；如果是有向图，删除这一行
            adjacencyList[edge.to].push(edge.from);
        });

        // 渲染到页面
        let html = '';
        for (const [nodeId, neighbors] of Object.entries(adjacencyList)) {
            html += `<div><strong>节点 ${nodeId}</strong>: [ ${neighbors.join(', ')} ]</div>`;
        }
        adjacencyListContent.innerHTML = html || '<div>暂无节点/边</div>';
    }

    // 6. 创建新节点
    function createNode(x, y) {
        const newNode = {
            id: nodeIdCounter++,
            x,
            y,
            radius: 20,
            color: '#2196F3'
        };
        nodes.push(newNode);
        drawGraph();
    }

    // 7. 删除节点（及关联的边）
    function deleteNode(nodeId) {
        // 删除节点
        nodes = nodes.filter(node => node.id !== nodeId);
        // 删除关联的边
        edges = edges.filter(edge => edge.from !== nodeId && edge.to !== nodeId);
        // 重置选中状态
        if (selectedNode?.id === nodeId) selectedNode = null;
        drawGraph();
    }

    // 8. 绑定画布事件：点击创建节点/连线
    canvas.addEventListener('click', (e) => {
        const mousePos = getMousePos(canvas, e);
        // 检查是否点击到现有节点
        const clickedNode = nodes.find(node => isPointInNode(mousePos, node));

        if (clickedNode) {
            // 如果已有选中节点 → 生成边
            if (selectedNode && selectedNode.id !== clickedNode.id) {
                // 避免重复添加边（无向图去重）
                const edgeExists = edges.some(edge =>
                    (edge.from === selectedNode.id && edge.to === clickedNode.id) ||
                    (edge.from === clickedNode.id && edge.to === selectedNode.id)
                );
                if (!edgeExists) {
                    edges.push({ from: selectedNode.id, to: clickedNode.id });
                }
                // 取消选中
                selectedNode = null;
            } else {
                // 选中当前节点（准备连线）
                selectedNode = clickedNode;
            }
        } else {
            // 未点击到节点 → 创建新节点
            createNode(mousePos.x, mousePos.y);
            // 取消选中
            selectedNode = null;
        }
        drawGraph();
    });

    // 9. 绑定画布事件：右键删除节点
    canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault(); // 阻止默认右键菜单
        const mousePos = getMousePos(canvas, e);
        const clickedNode = nodes.find(node => isPointInNode(mousePos, node));
        if (clickedNode) {
            deleteNode(clickedNode.id);
        }
    });

    // 10. 绑定画布事件：拖拽节点
    canvas.addEventListener('mousedown', (e) => {
        const mousePos = getMousePos(canvas, e);
        draggingNode = nodes.find(node => isPointInNode(mousePos, node));
        if (draggingNode) {
            // 记录鼠标与节点中心的偏移（避免拖拽时节点瞬移）
            dragOffset.x = mousePos.x - draggingNode.x;
            dragOffset.y = mousePos.y - draggingNode.y;
            canvas.style.cursor = 'grabbing';
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (draggingNode) {
            const mousePos = getMousePos(canvas, e);
            // 更新节点位置（抵消偏移）
            draggingNode.x = mousePos.x - dragOffset.x;
            draggingNode.y = mousePos.y - dragOffset.y;
            drawGraph();
        }
    });

    canvas.addEventListener('mouseup', () => {
        draggingNode = null;
        canvas.style.cursor = 'crosshair';
    });

    canvas.addEventListener('mouseleave', () => {
        draggingNode = null;
        canvas.style.cursor = 'crosshair';
    });

    // 11. 绑定按钮事件
    createGraphBtn.addEventListener('click', () => {
        // 清空画布数据，重置状态
        nodes = [];
        edges = [];
        selectedNode = null;
        draggingNode = null;
        nodeIdCounter = 1;
        drawGraph();
    });

    clearBtn.addEventListener('click', () => {
        edges = [];
        selectedNode = null;
        drawGraph();
    });

    // 初始化绘制
    drawGraph();
</script>
</body>
</html>
